<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Illegal Chess — Modular Edition</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- Left Column: Top Player, Board + Eval Bar, Bottom Player -->
    <div class="board-stage">
      <div class="player-strip">
        <div style="display:flex;align-items:center;gap:8px">
          <strong style="font-size:13px">Black (Opponent / Bot)</strong>
        </div>
        <div style="display:flex;align-items:center;gap:6px;font-weight:700;color:#38bdf8;font-size:13px">
          <span id="mana-b">4 / 10</span> Mana
        </div>
      </div>

      <div class="board-row">
        <div class="eval-bar">
          <div class="eval-fill-black" style="height:50%"></div>
          <div class="eval-fill-white"></div>
        </div>
        <div id="chessboard" class="chessboard"></div>
      </div>

      <div class="player-strip">
        <div style="display:flex;align-items:center;gap:8px">
          <strong style="font-size:13px">White (You)</strong>
          <span style="font-size:11px;color:#81b64c;font-weight:700">King Immune to Instant/Delayed Spells</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;font-weight:700;color:#38bdf8;font-size:13px">
          <span id="mana-w">4 / 10</span> Mana
        </div>
      </div>
    </div>

    <!-- Right Column: Zero-Scroll Control Dock -->
    <div class="control-dock">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-weight:800;font-size:15px;letter-spacing:0.02em">ILLEGAL CHESS</div>
          <div style="font-size:11px;color:#9ca3af">31 Spells • Weighted Rarity • 10-Mana Cataclysm</div>
        </div>
        <div style="display:flex;gap:6px">
          <button id="btn-spellbook" style="background:#383632;color:#f1f5f9;border:none;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer">Spellbook (31)</button>
          <button id="btn-new-game" style="background:#81b64c;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer">New Match</button>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px">
        <span style="font-size:11px;font-weight:700;text-transform:uppercase;color:#9ca3af">Active Ability Hand (Bonus Action)</span>
        <button id="btn-reroll" style="background:#1f1e1b;color:#38bdf8;border:1px solid rgba(56,189,248,0.4);border-radius:5px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer">Reroll Card (1 Mana)</button>
      </div>

      <div id="hand-grid" class="hand-grid"></div>

      <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#9ca3af;margin-top:2px">Battle Log</div>
      <div id="move-log" class="move-log"></div>
    </div>
  </div>

  <!-- Spellbook Modal -->
  <div id="spellbook-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:999;align-items:center;justify-content:center;padding:24px">
    <div style="background:#262421;border-radius:10px;max-width:860px;width:100%;max-height:85dvh;display:flex;flex-direction:column;padding:16px;gap:12px;border:1px solid rgba(255,255,255,0.12)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong style="font-size:16px">Spellbook & Drop Odds (31 Abilities)</strong>
        <button id="btn-close-spellbook" style="background:#ef4444;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-weight:700;cursor:pointer">Close</button>
      </div>
      <div id="spellbook-grid" style="display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;overflow-y:auto;padding-right:4px"></div>
    </div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/abilities.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
